name: Linting

on:
  push:
    branches:
      - validate-ubuntu-26-issue-11-retry
  pull_request:
    branches:
      - validate-ubuntu-26-issue-11-retry

jobs:
  graylint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.11"
          # Only the serialized Deploy workflow writes the shared uv cache.
          save-cache: "false"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint changed code
        run: >-
          uv run --no-sync graylint --color --revision origin/main...
          -L flake8 -L mypy -L pylint ./palindromi_fi_builder
