name: Formatting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
 darker:
   # 2026-10-17: Ubuntu 26 CI validation is blocked by workflow-token scope.
   # Keep the validated image until TASKS.md [11] verifies Ubuntu 26.
   runs-on: ubuntu-24.04
   steps:
     - uses: actions/checkout@v7
       with:
         fetch-depth: 0
     - uses: astral-sh/setup-uv@v10.2.0
       with:
         version: "0.12.17"
         python-version: "3.11"
     - name: Install dependencies
       run: uv sync --frozen
     - name: Check formatting of changed code
       run: >-
         uv run --no-sync darker --check --diff --isort --color
         --revision origin/main... ./palindromi_fi_builder
