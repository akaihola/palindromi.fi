name: Deploy

on:
  push:
    branches:
      - validate-ubuntu-26-issue-11

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.11"
          # The pages concurrency group serializes this sole shared-cache writer.
          save-cache: "true"
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Build site
        run: uv run --no-sync --no-dev make build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html/
