name: Deploy

on:
  push:
    branches:
      - main
      - pacer-f1387035-ea93-4f1e-99b4-4a37e3892914

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Build site
        run: uv run --no-sync --no-dev make build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html/

