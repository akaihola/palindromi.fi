name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 2026-10-17: Ubuntu 26 CI validation is blocked by workflow-token scope.
    # Keep the validated image until TASKS.md [11] verifies Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.11"
          # The pages concurrency group serializes this sole shared-cache writer.
          save-cache: "true"
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Build site
        run: uv run --no-sync --no-dev make build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: html/

  deploy:
    needs: build
    # 2026-10-17: Ubuntu 26 CI validation is blocked by workflow-token scope.
    # Keep the validated image until TASKS.md [11] verifies Ubuntu 26.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
